<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TouchController Technical Documentation & Gesture Engine Reference</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; background: #0f141c; color: #e2e8f0; font-family: -apple-system, system-ui, sans-serif; }
    #doc-root { width: 100%; min-height: 100vh; position: relative; }
  </style>
  <script src="../Library/DomBasics.js" onerror="this.onerror=null; this.src='/Library/DomBasics.js';"></script>
  <script src="../Library/UITools.js" onerror="this.onerror=null; this.src='/Library/UITools.js';"></script>
  <script src="../Library/DocumentReader.js" onerror="this.onerror=null; this.src='/Library/DocumentReader.js';"></script>
  
  <!-- Documentation content classes -->
  <script src="js/docs/TouchControllerArchitectureDoc.js"></script>
  <script src="js/docs/LeftTrackpadNavigationDoc.js"></script>
  <script src="js/docs/RightTrackpadControlsDoc.js"></script>
  <script src="js/docs/WebRTCClientNetworkingDoc.js"></script>
</head>
<body>
  <div id="doc-root"></div>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (typeof DomBasics !== 'undefined' && typeof DomBasics.run === 'function') {
        DomBasics.run();
      }

      const reader = new DocumentReader({
        container: document.getElementById('doc-root'),
        brandTitle: 'TouchController Docs',
        brandIcon: '📱',
        pages: [
          {
            id: 'architecture',
            title: 'I. System Architecture',
            docClass: () => TouchControllerArchitectureDoc
          },
          {
            id: 'navigation',
            title: 'II. Left Trackpad (Navigation & Inertia)',
            docClass: () => LeftTrackpadNavigationDoc
          },
          {
            id: 'controls',
            title: 'III. Right Trackpad (Sliders & Locks)',
            docClass: () => RightTrackpadControlsDoc
          },
          {
            id: 'networking',
            title: 'IV. WebRTC & Signaling Protocol',
            docClass: () => WebRTCClientNetworkingDoc
          }
        ]
      });

      reader.init();
    });
  </script>
</body>
</html>
